# Paste these two location blocks INSIDE the existing server { ... } block in
# /etc/nginx/sites-enabled/https-site (place them BEFORE the final closing brace).
#
# Order matters: the more specific /trainforge/static/ block must appear before
# the catch-all /trainforge/ block.

location /trainforge/static/ {
    alias /var/www/djangoapps/trainforge/staticfiles/;
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
}

location /trainforge/ {
    # Trailing slash on proxy_pass is REQUIRED: it strips the /trainforge/
    # prefix before forwarding to Gunicorn. Django's URL patterns live at
    # root and rely on FORCE_SCRIPT_NAME only for outgoing URL generation,
    # not incoming path stripping.
    proxy_pass         http://127.0.0.1:8002/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_redirect     off;
    client_max_body_size 20m;
}
