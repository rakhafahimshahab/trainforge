{% extends "base.html" %}

{% block title %}Log out - TrainForge{% endblock %}

{% block body %}
<div class="container-sm" style="padding:60px 0;">
  <div style="display:grid;place-items:center;">
    <div class="card card-lg" style="width:min(440px,100%);">
      <h1 style="margin:0 0 8px;font-size:1.7rem;">Log out?</h1>
      <p class="muted">Are you sure you want to log out of TrainForge?</p>
      <form method="post" action="{% url 'account_logout' %}" style="margin-top:24px;">
        {% csrf_token %}
        {% if redirect_field_value %}
          <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}
        <div style="display:grid;gap:12px;">
          <button type="submit" class="btn btn-primary">Log Out</button>
          <a href="{% url 'core:dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
