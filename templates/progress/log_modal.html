<div class="modal-backdrop" data-modal-backdrop>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="log-modal-title">
    <div class="modal-header">
      <div>
        <span class="modal-eyebrow">Progress</span>
        <h2 id="log-modal-title" class="modal-title">{{ title }}</h2>
        <p class="modal-subtitle">Record what was actually done. Weight is optional.</p>
      </div>
      <button type="button" class="modal-close-btn" aria-label="Close" onclick="tfCloseModal()">x</button>
    </div>

    <form method="post"
          hx-post="{% url 'progress:log_create' client.pk %}"
          hx-target="#modal"
          hx-swap="innerHTML"
          novalidate>
      {% csrf_token %}

      {% if form.non_field_errors %}
        <div class="notice notice-danger" role="alert">{{ form.non_field_errors }}</div>
      {% endif %}

      <div class="grid-2">
        <div>
          <label for="id_log_date">Date</label>
          <input id="id_log_date" type="date" name="log_date" required value="{{ form.log_date.value|date:'Y-m-d'|default:'' }}">
        </div>
        <div>
          <label for="id_exercise">Exercise</label>
          <select id="id_exercise" name="exercise" required>
            {% for ex in form.fields.exercise.queryset %}
              <option value="{{ ex.pk }}" {% if form.exercise.value|stringformat:"s" == ex.pk|stringformat:"s" %}selected{% endif %}>{{ ex.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="id_actual_sets">Actual sets</label>
          <input id="id_actual_sets" type="number" min="0" name="actual_sets" value="{{ form.actual_sets.value|default:3 }}">
        </div>
        <div>
          <label for="id_actual_reps">Actual reps</label>
          <input id="id_actual_reps" type="number" min="0" name="actual_reps" value="{{ form.actual_reps.value|default:10 }}">
        </div>
      </div>

      <label for="id_actual_weight_kg">Weight (kg)</label>
      <input id="id_actual_weight_kg" type="number" step="0.5" min="0" name="actual_weight_kg" placeholder="Optional" value="{{ form.actual_weight_kg.value|default:'' }}">

      <label for="id_notes">Notes</label>
      <textarea id="id_notes" name="notes" rows="2" placeholder="How did the session go?">{{ form.notes.value|default:'' }}</textarea>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="tfCloseModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Entry</button>
      </div>
    </form>
  </div>
</div>
