{% extends "base_app.html" %}

{% block title %}{{ title }} - TrainForge{% endblock %}

{% block main %}
<div class="page-top">
  <div>
    <h1>{{ title }}</h1>
    <p class="muted">Reusable exercise - sets and reps can be tweaked per plan.</p>
  </div>
  <a href="{% url 'exercises:list' %}" class="btn btn-secondary">← Back</a>
</div>

<form method="post" class="card card-lg" style="max-width:640px;" novalidate>
  {% csrf_token %}

  <label for="id_name">Exercise name <span aria-hidden="true" style="color:var(--accent);">*</span></label>
  <input id="id_name" type="text" name="name" required value="{{ form.name.value|default:'' }}">
  {% if form.name.errors %}<div class="form-error">{{ form.name.errors|join:" " }}</div>{% endif %}

  <label for="id_category">Category</label>
  <select id="id_category" name="category">
    {% for value, label in form.fields.category.choices %}
      <option value="{{ value }}" {% if form.category.value == value or form.instance.category == value %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>

  <label for="id_description">Description</label>
  <textarea id="id_description" name="description" rows="2">{{ form.description.value|default:'' }}</textarea>

  <div class="grid-2">
    <div>
      <label for="id_default_sets">Default sets</label>
      <input id="id_default_sets" type="number" min="1" max="20" name="default_sets" value="{{ form.default_sets.value|default:3 }}">
    </div>
    <div>
      <label for="id_default_reps">Default reps</label>
      <input id="id_default_reps" type="number" min="1" max="50" name="default_reps" value="{{ form.default_reps.value|default:10 }}">
    </div>
  </div>

  <div class="flex-row" style="margin-top:24px;">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'exercises:list' %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
